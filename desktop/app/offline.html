<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Prizza</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#1E293B;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;text-align:center}
.box{max-width:30rem;padding:2rem}.logo{width:64px;height:64px;border-radius:16px;background:#fff;color:#1E293B;font:700 38px/64px Segoe UI,sans-serif;margin:0 auto 1.2rem}
h1{font-size:1.5rem;margin:.2rem 0}p{color:#b6c0d1;line-height:1.6;margin:.4rem 0}button{margin-top:1.2rem;padding:.7rem 1.6rem;border:0;border-radius:.7rem;background:#fff;color:#1E293B;font-weight:700;font-size:.95rem;cursor:pointer}
#st{height:1.2rem;font-size:.8rem;color:#8fa0bb;margin-top:.8rem}
</style></head><body><div class="box"><div class="logo">P</div>
<h1>No internet connection</h1><p>Prizza needs the internet. It will reconnect by itself as soon as you are online.</p>
<h1 dir="rtl" style="margin-top:1.2rem">لا يوجد اتصال بالإنترنت</h1><p dir="rtl">يحتاج برايزا إلى الإنترنت، وسيعيد الاتصال تلقائيًا عند عودته.</p>
<button id="b">Try again / حاول مجددًا</button><div id="st"></div></div>
<script>
const st=document.getElementById('st');
async function go(){ st.textContent='…'; let ok=false; try{ ok=await prizzaDesktop.retry(); }catch(e){} if(!ok) st.textContent='Still offline / لا يزال غير متصل'; }
document.getElementById('b').onclick=go; addEventListener('online',go);
</script></body></html>
